name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dash/web/package-lock.json
      - run: npm ci
      - run: npm --prefix dash/web ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:web
